<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Peserta</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 30px 15px;
            background-color: #f3f5f7;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 760px;
            margin: auto;
            padding: 30px 45px;
            background-color: #bed411;
        }
        h2 {
            margin-top: 0;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
            font-family: Georgia, serif;
            color: #333;
            font-size: 24px;
        }
        .form-group {
            display: grid;
            grid-template-columns: 185px 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        label {
            padding-top: 7px;
            color: #169c4a;
            font-family: Georgia, serif;
            font-weight: bold;
            font-size: 17px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            background-color: white;
            font-size: 14px;
        }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .three-columns {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .address-field {
            margin-bottom: 18px;
        }
        .caption {
            display: block;
            margin-top: 6px;
            color: #182ebe;
            font-family: Georgia, serif;
            font-size: 13px;
        }
        textarea {
            height: 130px;
            resize: vertical;
        }
        .buttons {
            margin-left: 205px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 11px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-daftar {
            background-color: #b65d88;
            color: white;
        }
        .btn-reset {
            background-color: white;
            border: 1px solid #ccc;
        }
        @media (max-width: 600px) {
            .container {
                padding: 22px 18px;
            }
            .form-group {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .buttons {
                margin-left: 0;
            }
        }
        @media (max-width: 400px) {
            .two-columns,
            .three-columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>FORMULIR PENDAFTARAN PESERTA</h2>

    <form id="formPendaftaran">

        <!-- NAMA LENGKAP -->
        <div class="form-group">
            <label>Nama Lengkap</label>

            <div class="two-columns">
                <div>
                    <input type="text" name="nama_depan"
                           placeholder="Nama depan" required>
                    <span class="caption">Nama Depan</span>
                </div>

                <div>
                    <input type="text" name="nama_belakang"
                           placeholder="Nama belakang" required>
                    <span class="caption">Nama Belakang</span>
                </div>
            </div>
        </div>

        <!-- ALAMAT -->
        <div class="form-group">
            <label>Alamat</label>

            <div>
                <div class="address-field">
                    <input type="text" name="jalan"
                           placeholder="Jalan / Kampung" required>
                    <span class="caption">Jalan / Kampung</span>
                </div>

                <div class="address-field">
                    <input type="text" name="kecamatan"
                           placeholder="Kecamatan" required>
                    <span class="caption">Kecamatan</span>
                </div>

                <div class="two-columns address-field">
                    <div>
                        <input type="text" name="kota"
                               placeholder="Kota/Kabupaten" required>
                        <span class="caption">Kota/Kabupaten</span>
                    </div>

                    <div>
                        <input type="text" name="provinsi"
                               placeholder="Provinsi" required>
                        <span class="caption">Provinsi</span>
                    </div>
                </div>

                <div class="two-columns">
                    <div>
                        <input type="text" name="kode_pos"
                               placeholder="Kode Pos"
                               pattern="[0-9]{5}"
                               maxlength="5" required>
                        <span class="caption">Kode Pos</span>
                    </div>

                    <div>
                        <select name="negara" required>
                            <option value="">Harap Dipilih</option>
                            <option value="Indonesia">Indonesia</option>
                            <option value="Malaysia">Malaysia</option>
                            <option value="Singapura">Singapura</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                        <span class="caption">Negara</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- TANGGAL LAHIR -->
        <div class="form-group">
            <label>Tanggal Lahir</label>

            <div class="three-columns">
                <div>
                    <select name="bulan" required>
                        <option value="">Pilih bulan</option>
                        <option>Januari</option>
                        <option>Februari</option>
                        <option>Maret</option>
                        <option>April</option>
                        <option>Mei</option>
                        <option>Juni</option>
                        <option>Juli</option>
                        <option>Agustus</option>
                        <option>September</option>
                        <option>Oktober</option>
                        <option>November</option>
                        <option>Desember</option>
                    </select>
                    <span class="caption">Bulan</span>
                </div>

                <div>
                    <select name="tanggal" required>
                        <option value="">Pilih tanggal</option>
                        <script>
                            for (let i = 1; i <= 31; i++) {
                                document.write(
                                    `<option value="${i}">${i}</option>`
                                );
                            }
                        </script>
                    </select>
                    <span class="caption">Tanggal</span>
                </div>

                <div>
                    <select name="tahun" required>
                        <option value="">Pilih Tahun</option>
                        <script>
                            for (let i = new Date().getFullYear();
                                 i >= 1940; i--) {
                                document.write(
                                    `<option value="${i}">${i}</option>`
                                );
                            }
                        </script>
                    </select>
                    <span class="caption">Tahun</span>
                </div>
            </div>
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label>E-mail</label>

            <div>
                <input type="email" name="email"
                       placeholder="myname@example.com"
                       required>
            </div>
        </div>

        <!-- TELEPON RUMAH -->
        <div class="form-group">
            <label>Telepon Rumah</label>

            <div class="two-columns">
                <div>
                    <input type="tel" name="kode_area"
                           placeholder="Kode area">
                    <span class="caption">Kode Pos</span>
                </div>

                <div>
                    <input type="tel" name="telepon_rumah"
                           placeholder="Nomor telepon">
                    <span class="caption">No Telepon</span>
                </div>
            </div>
        </div>

        <!-- HP -->
        <div class="form-group">
            <label>HP</label>

            <div>
                <input type="tel" name="hp"
                       placeholder="08xxxxxxxxxx" required>
            </div>
        </div>

        <!-- NISN -->
        <div class="form-group">
            <label>NO INDUK SISWA NASIONAL</label>

            <div>
                <input type="text" name="nisn"
                       placeholder="Masukkan 10 digit NISN"
                       inputmode="numeric"
                       pattern="[0-9]{10}"
                       maxlength="10" required>
            </div>
        </div>

        <!-- ASAL SEKOLAH -->
        <div class="form-group">
            <label>ASAL SEKOLAH</label>

            <div>
                <input type="text" name="asal_sekolah" required>
            </div>
        </div>

        <!-- ALAMAT SEKOLAH -->
        <div class="form-group">
            <label>ALAMAT SEKOLAH</label>

            <div>
                <textarea name="alamat_sekolah" required></textarea>
            </div>
        </div>

        <!-- TOMBOL -->
        <div class="buttons">
            <button type="submit" class="btn-daftar">
                Daftar
            </button>

            <button type="reset" class="btn-reset">
                Reset
            </button>
        </div>

    </form>

</div>

<script>
    document.getElementById("formPendaftaran")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            alert(
                "Formulir berhasil diisi dan divalidasi!"
            );

        });
</script>

</body>
</html>
